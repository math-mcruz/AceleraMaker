name: CI/CD - Projeto Final

on: 
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: windows-latest
    
    steps:
      - name: baixa o Código-Fonte
        uses: actions/checkout@v4

      - name: instala o GnuCOBOL (MSYS2 x64)
        uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gnucobol mingw-w64-ucrt-x86_64-gcc

      - name: modifica o PATH
        shell: pwsh
        run: |
          $msys2Bin = "${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin"
          echo "$msys2Bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "MSYS2_BIN_PATH=$msys2Bin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: configura .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          include-prerelease: true

      - name: compila COBOL
        shell: pwsh
        run: |
          $msys2Root = $env:MSYS2_BIN_PATH.Replace("\bin", "")
          $env:COB_CONFIG_DIR = Join-Path $msys2Root "share\gnucobol\config"

          $env:PATH = "$env:MSYS2_BIN_PATH;" + $env:PATH
          
          cd ProjetoFinal/CodigoFonte/COBOL/SOURCE
          $cobcExe = Join-Path $env:MSYS2_BIN_PATH "cobc.exe"
          
          & $cobcExe -m -I "../COPYLIB" CADASCLI.cbl
          & $cobcExe -m -I "../COPYLIB" CONSCLI.cbl
          & $cobcExe -m -I "../COPYLIB" ATUACLI.cbl
          & $cobcExe -m -I "../COPYLIB" DELECLI.cbl
          echo "COBOL compilado com sucesso!"

      - name: compila a API e os testes
        shell: pwsh
        run: |
          cd ProjetoFinal/CodigoFonte/dotnet
          dotnet build --configuration Release
          
          cd ../tests
          dotnet build --configuration Release

      - name: copia as DLLs e as unidades dependentes
        shell: pwsh
        run: |
          $DirTeste = "$env:GITHUB_WORKSPACE\ProjetoFinal\CodigoFonte\tests\bin\Release\net10.0\"
          New-Item -ItemType Directory -Force -Path $DirTeste          

          Copy-Item "ProjetoFinal\CodigoFonte\COBOL\SOURCE\*.dll" -Destination $DirTeste -Force

          Copy-Item "$env:MSYS2_BIN_PATH\libcob*.dll" -Destination $DirTeste -Force
          Copy-Item "$env:MSYS2_BIN_PATH\libgmp*.dll" -Destination $DirTeste -Force
          Copy-Item "$env:MSYS2_BIN_PATH\libwinpthread*.dll" -Destination $DirTeste -Force
          echo "DLLs copiadas com sucesso!"

      - name: executa testes
        shell: pwsh
        run: |
          $env:PATH = "$env:MSYS2_BIN_PATH;" + $env:PATH

          $msys2Root = $env:MSYS2_BIN_PATH.Replace("\bin", "")
          $env:COB_CONFIG_DIR = Join-Path $msys2Root "share\gnucobol\config"
          
          cd ProjetoFinal/CodigoFonte/tests
          dotnet test --configuration Release --no-build --verbosity normal