name: CI/CD - Projeto Final

on: 
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: windows-latest
    
    steps:
      - name: baixa o Código-Fonte
        uses: actions/checkout@v4

      - name: instala o GnuCOBOL (MSYS2 x64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gnucobol mingw-w64-ucrt-x86_64-gcc

      - name: modifica o PATH
        shell: pwsh
        run: |
          echo "C:\msys64\ucrt64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append          

      - name: configura .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          include-prerelease: true

      - name: compila COBOL
        shell: pwsh
        run: |
          cd ProjetoFinal/CodigoFonte/COBOL/SOURCE          
          & "C:\msys64\ucrt64\bin\cobc.exe" -m -I "../COPYLIB" CADASCLI.cbl
          & "C:\msys64\ucrt64\bin\cobc.exe" -m -I "../COPYLIB" CONSCLI.cbl
          & "C:\msys64\ucrt64\bin\cobc.exe" -m -I "../COPYLIB" ATUACLI.cbl
          & "C:\msys64\ucrt64\bin\cobc.exe" -m -I "../COPYLIB" DELECLI.cbl
          echo "COBOL compilado com sucesso!"

      - name: compila a API e os testes
        shell: pwsh
        run: |
          cd ProjetoFinal/CodigoFonte/dotnet
          dotnet build --configuration Release
          
          cd ../tests
          dotnet build --configuration Release

      - name: copia as DLLs e as unidades dependentes
        shell: pwsh
        run: |
          $DirTeste = "$env:GITHUB_WORKSPACE\ProjetoFinal\CodigoFonte\tests\bin\Release\net10.0\"
          New-Item -ItemType Directory -Force -Path $DirTeste          

          Copy-Item "ProjetoFinal\CodigoFonte\COBOL\SOURCE\*.dll" -Destination $DirTeste -Force

          Copy-Item "C:\msys64\ucrt64\bin\libcob*.dll" -Destination $DirTeste -Force
          Copy-Item "C:\msys64\ucrt64\bin\libgmp*.dll" -Destination $DirTeste -Force
          Copy-Item "C:\msys64\ucrt64\bin\libwinpthread*.dll" -Destination $DirTeste -Force
          echo "DLLs copiadas com sucesso!"

      - name: executa testes
        shell: pwsh
        run: |
          $env:PATH = "C:\msys64\ucrt64\bin;" + $env:PATH
          
          cd ProjetoFinal/CodigoFonte/tests
          dotnet test --configuration Release --no-build --verbosity normal